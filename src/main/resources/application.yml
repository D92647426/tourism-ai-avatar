server:
  port: 8080
  servlet:
    session:
      # 游客与管理员共用服务端会话；默认 30 分钟无操作后过期，过期后管理接口返回 401。
      timeout: 30m
      cookie:
        # 会话 Cookie 不暴露给脚本，降低 XSS 窃取风险。
        http-only: true
        same-site: lax

spring:
  application:
    name: ai-guide

ai:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat

# REQ-053: optional local worker; unavailable -> browser system speech.
speech:
  local:
    enabled: ${LOCAL_SPEECH_ENABLED:false}
    base-url: ${LOCAL_SPEECH_BASE_URL:http://127.0.0.1:9880}

# 数据文件存储路径（data.users-file 可用测试临时文件或本地私有路径覆盖）
data:
  knowledge-file: data/knowledge.json
  interactions-file: data/interactions.json
  config-file: data/config.json
  users-file: data/users.json
