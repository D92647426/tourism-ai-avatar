name: Team checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_doc_links.py
      - run: python scripts/smoke_teacher_project.py --jar target/ai-guide-1.0.0.jar
